[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-cues"
version = "0.1.0"
description = "Video visual cue extraction: facial expressions, FACS Action Units, head pose, gaze, body language, and posture analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Roosevelt Advisors" }
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pillow>=9.0.0",
    "av>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
visual-cues = "visual_cues.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["visual_cues*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
